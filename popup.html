<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            width: 320px;
            margin: 12px;
            color: #111;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .title {
            font-size: 14px;
            line-height: 1.2;
            user-select: none;
        }

        .sub {
            font-size: 12px;
            opacity: .75;
            margin-top: 6px;
            word-break: break-word;
        }

        .divider {
            height: 1px;
            background: rgba(0,0,0,.08);
            margin: 12px 0;
        }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
            flex: 0 0 auto;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: #cfd3da;
            transition: 0.15s ease;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: #fff;
            transition: 0.15s ease;
            box-shadow: 0 1px 3px rgba(0,0,0,.2);
        }
        input:checked + .slider { background: #5A42FF; }
        input:checked + .slider:before { transform: translateX(20px); }
        input:disabled + .slider { background: #e6e8ee; cursor: not-allowed; }
        input:disabled + .slider:before { background: #f7f8fb; box-shadow: none; }

        .listTitle {
            font-size: 13px;
            margin-bottom: 6px;
            opacity: .9;
        }

        .domainRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(0,0,0,.08);
        }

        .domainName {
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 240px;
        }

        .btn {
            border: 1px solid rgba(0,0,0,.12);
            background: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .hint {
            margin-top: 8px;
            font-size: 12px;
            opacity: .75;
        }

        .hidden { display: none; }
    </style>
</head>

<body>
<div class="row">
    <div class="title">VPN для этого сайта</div>
    <label class="switch">
        <input id="siteToggle" type="checkbox" />
        <span class="slider"></span>
    </label>
</div>

<div id="siteInfo" class="sub"></div>
<div id="hint" class="hint hidden"></div>

<div class="divider"></div>

<div class="row">
    <div class="title">Авто-переключение</div>
    <label class="switch">
        <input id="globalToggle" type="checkbox" />
        <span class="slider"></span>
    </label>
</div>
<div id="globalInfo" class="sub"></div>

<div class="divider"></div>

<div class="listTitle">Домены через VPN</div>
<div id="domains"></div>

<script src="popup.js"></script>
</body>
</html>
