<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8"/>
	<style>
		body {
			font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
			width: 320px;
			margin: 12px;
		}

		.row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
		}

		.sub {
			font-size: 12px;
			opacity: .75;
			margin-top: 6px;
			word-break: break-word;
		}

		.divider {
			height: 1px;
			background: rgba(0, 0, 0, .08);
			margin: 12px 0;
		}

		.switch {
			position: relative;
			display: inline-block;
			width: 46px;
			height: 26px;
		}

		.switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}

		.slider {
			position: absolute;
			inset: 0;
			border-radius: 999px;
			background: #cfd3da;
			transition: .15s ease;
			cursor: pointer;
		}

		.slider:before {
			content: "";
			position: absolute;
			width: 20px;
			height: 20px;
			left: 3px;
			top: 3px;
			border-radius: 50%;
			background: #fff;
			transition: .15s ease;
			box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
		}

		input:checked + .slider {
			background: #5A42FF;
		}

		input:checked + .slider:before {
			transform: translateX(20px);
		}

		.btn {
			border: 1px solid rgba(0, 0, 0, .12);
			background: #fff;
			border-radius: 8px;
			padding: 6px 10px;
			font-size: 12px;
			cursor: pointer;
		}

		.domainRow {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			padding: 6px 0;
			border-bottom: 1px dashed rgba(0, 0, 0, .08);
		}

		.domainName {
			font-size: 13px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			max-width: 240px;
		}

		.hint {
			margin-top: 8px;
			font-size: 12px;
			opacity: .75;
		}
	</style>
</head>
<body>
<div class="row">
	<div>VPN для этого сайта</div>
	<label class="switch">
		<input id="siteToggle" type="checkbox"/>
		<span class="slider"></span>
	</label>
</div>
<div id="siteInfo" class="sub"></div>

<div class="divider"></div>

<div class="row">
	<div>Расширение активно</div>
	<label class="switch">
		<input id="globalToggle" type="checkbox"/>
		<span class="slider"></span>
	</label>
</div>
<div id="globalInfo" class="sub"></div>

<div class="divider"></div>

<div class="row">
	<div>Домены через VPN</div>
	<button id="clearBtn" class="btn">Очистить</button>
</div>

<div id="domains"></div>
<div id="hint" class="hint"></div>

<script src="popup.js"></script>
</body>
</html>
